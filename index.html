<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Share your photo</title>
<link rel="stylesheet" href="style.css"></head><body><main>
<h1>Share your photo</h1><p id="hi"></p>
<label>Your name<input id="name" maxlength="40" autocomplete="name"></label>
<label>Photos (JPG or PNG, max 5 MB each)<input id="files" type="file" accept="image/jpeg,image/png" multiple></label>
<label class="c"><input type="checkbox" id="consent"><span>I agree that my name and photo(s) will be shown publicly on the event screen, as described in the <a href="privacy.html" target="_blank">privacy policy</a>.</span></label>
<button id="go">Upload</button><div id="s" role="status"></div>
<p><button id="del" class="link" hidden>Delete all my photos and data</button></p>
</main><script>
const $=i=>document.getElementById(i),MAX=5*1048576,s=$('s');
const say=(t,c)=>{s.textContent=t;s.className=c||''};
function me(){fetch('api/me.php').then(r=>r.json()).then(m=>{if(m.name){$('name').value=m.name;$('hi').textContent=`Welcome back, ${m.name}! You have ${m.count} photo(s) on the screen.`;$('del').hidden=false}})}
me();
async function send(f,name){ // sequential queue; retries when server says busy (503)
  for(let t=0;t<4;t++){
    const fd=new FormData();fd.append('name',name);fd.append('consent','yes');fd.append('photo',f);
    let r;try{r=await fetch('api/upload.php',{method:'POST',body:fd})}catch{return 'network error'}
    if(r.status===503){await new Promise(z=>setTimeout(z,2000*(t+1)));continue}
    return r.ok?null:((await r.json().catch(()=>({}))).error||'upload failed');
  } return 'server busy, try again';
}
$('go').onclick=async()=>{
  const name=$('name').value.trim(),files=[...$('files').files];
  if(!name)return say('Please enter your name.','err');
  if(!files.length)return say('Choose at least one photo.','err');
  if(!$('consent').checked)return say('Please tick the consent box.','err');
  $('go').disabled=true;let ok=0,bad=[];
  for(const f of files){
    if(!/^image\/(jpeg|png)$/.test(f.type)){bad.push(`${f.name}: only JPG/PNG`);continue}
    if(f.size>MAX){bad.push(`${f.name}: over 5 MB`);continue}
    say(`Uploading ${f.name}…`);const e=await send(f,name);e?bad.push(`${f.name}: ${e}`):ok++;
  }
  $('go').disabled=false;say(`${ok} uploaded.${bad.length?' Problems: '+bad.join('; '):' Look at the screen!'}`,bad.length?'err':'ok');me();
};
$('del').onclick=async()=>{if(!confirm('Permanently delete all your photos and data?'))return;
  const r=await fetch('api/delete.php',{method:'POST'});say(r.ok?'Your data has been deleted.':'Nothing to delete.',r.ok?'ok':'err');$('del').hidden=true;$('hi').textContent=''};
</script></body></html>
